# qbootctl finds the slots through the partition labels. Right after the
# switch to the root filesystem udev may not have recreated them yet, and
# qbootctl then fails with "No slots found": wait for both boot partitions.
[Unit]
Wants=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
After=dev-disk-by\x2dpartlabel-boot_a.device dev-disk-by\x2dpartlabel-boot_b.device
