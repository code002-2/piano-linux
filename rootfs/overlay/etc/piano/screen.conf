# Read by /usr/lib/piano/power-button (piano-power-button.user service).
# Seconds the screen stays dark (cover closed or power key short press)
# before the system suspends through s2idle; opening the cover or
# pressing the power key cancels a pending suspend, and a resume with
# the cover still closed arms it again.
#
# 0 disables the suspend: s2idle itself works (verified on the device:
# entry, multi-minute sleep, ~2 s resume, WLAN recovery), but the native
# display does not come back — the DSI host errors out on resume
# (dsi_err_worker status=4, the same unrecoverable state as a DPMS off).
# Raise this once display recovery is fixed.
SUSPEND_AFTER=0
