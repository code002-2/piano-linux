# RPMh sleep statistics: /sys/kernel/debug/qcom_stats counters for the
# AOSS/CX/DDR low-power modes and the ADSP/CDSP subsystems.  The stock
# DT only carries the downstream "qcom,rpmh-stats-v4" compatible; the
# power dtbo appends the mainline one.  udev coldplug is blocked for
# of:* modaliases by 80-drivers.rules, so the module must be loaded
# explicitly.
qcom_stats
