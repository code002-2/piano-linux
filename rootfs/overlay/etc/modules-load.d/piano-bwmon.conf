# CPU bandwidth monitors: icc-bwmon samples each CPU cluster's memory
# traffic and votes on the APPS->EBI1 interconnect path (the stock bwmon4
# nodes have no mainline driver; the power dtbo re-states them in the
# upstream sm8750.dtsi shape).  udev coldplug is blocked for of:*
# modaliases by 80-drivers.rules, so the module must be loaded
# explicitly.
icc-bwmon
